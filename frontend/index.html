<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBW CMS</title>
  </head>
  <body class="overflow-hidden">
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      {% for key in boot %}
        window["{{ key }}"] = {{ boot[key] | tojson }};
      {% endfor %}
    </script>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function(d,t) {
        var BASE_URL="https://chat.mbwcloud.com";
        var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
        g.src=BASE_URL+"/packs/js/sdk.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g,s);
        g.onload=function(){
          window.chatwootSDK.run({
            websiteToken: 'SVUjSAUqzn4aACRtVUn3EHh6',
            baseUrl: BASE_URL
          })
        }
      })(document,"script");
    </script>
  </body>
</html>
